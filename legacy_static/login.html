<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - DFA Commerce</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Simple Navbar -->
  <nav class="navbar navbar-custom">
    <div class="container justify-content-center">
      <a class="navbar-brand" href="/">
        <div class="brand-icon"><i class="bi bi-diagram-3-fill"></i></div>
        <span>DFA<span class="text-primary">Commerce</span></span>
      </a>
    </div>
  </nav>

  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5 col-xl-4">
        
        <div class="card border-0 shadow-lg rounded-4 p-4 bg-white">
          <div class="text-center mb-4">
            <h4 class="fw-bold text-dark">Welcome Back</h4>
            <p class="text-muted small">Log in to manage your cart and track orders with DFA verification.</p>
          </div>

          <!-- Alert for errors -->
          <div id="loginAlert" class="alert alert-danger py-2 small" style="display: none;"></div>

          <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" id="loginEmail" class="form-control border-start-0" required placeholder="name@example.com">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" id="loginPassword" class="form-control border-start-0" required placeholder="••••••••">
              </div>
            </div>

            <button type="submit" id="loginSubmitBtn" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
              Sign In
            </button>
          </form>

          <!-- Quick 1-Click Demo Credentials -->
          <div class="border-top pt-3 text-center">
            <span class="small text-muted d-block mb-2 fw-semibold">Quick Demo 1-Click Fill:</span>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-outline-secondary btn-sm flex-fill" onclick="fillDemo('customer')">
                <i class="bi bi-person me-1"></i> Customer
              </button>
              <button type="button" class="btn btn-outline-danger btn-sm flex-fill" onclick="fillDemo('admin')">
                <i class="bi bi-shield-lock me-1"></i> Admin
              </button>
            </div>
          </div>

          <div class="text-center mt-4 small">
            <span class="text-muted">Don't have an account?</span>
            <a href="/register" class="fw-semibold text-primary text-decoration-none ms-1">Create one</a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <footer class="text-center py-3 text-muted small mt-auto">
    &copy; 2026 DFA Commerce • Deterministic Finite Automaton Order Management
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    function fillDemo(type) {
      const emailInput = document.getElementById('loginEmail');
      const passwordInput = document.getElementById('loginPassword');

      if (type === 'admin') {
        emailInput.value = 'admin@dfamall.com';
        passwordInput.value = 'admin123';
      } else {
        emailInput.value = 'customer@dfamall.com';
        passwordInput.value = 'customer123';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const alertBox = document.getElementById('loginAlert');
      const btn = document.getElementById('loginSubmitBtn');

      alertBox.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success) {
          showToast('Signed in successfully!', 'success');
          setTimeout(() => {
            window.location.href = data.redirectUrl || '/';
          }, 400);
        } else {
          alertBox.textContent = data.error || 'Invalid email or password.';
          alertBox.style.display = 'block';
          btn.disabled = false;
          btn.innerHTML = 'Sign In';
        }
      } catch (err) {
        alertBox.textContent = 'Network error during sign in.';
        alertBox.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
      }
    }
  </script>
</body>
</html>
