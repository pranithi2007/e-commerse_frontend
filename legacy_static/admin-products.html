<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Management - DFA Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="/">
        <div class="brand-icon bg-danger"><i class="bi bi-shield-lock-fill"></i></div>
        <span>DFA<span class="text-primary">Admin</span></span>
      </a>
      
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
          <li class="nav-item"><a class="nav-link" href="/admin">Overview</a></li>
          <li class="nav-item"><a class="nav-link" href="/admin/orders">Order Management (DFA)</a></li>
          <li class="nav-item"><a class="nav-link active" href="/admin/products">Product Catalog</a></li>
          <li class="nav-item"><a class="nav-link" href="/dfa-spec">DFA Specification</a></li>
        </ul>

        <ul class="navbar-nav align-items-center gap-2">
          <li class="nav-item">
            <a href="/" class="btn btn-outline-primary btn-sm me-2">Storefront</a>
          </li>
          <div id="navAuthContainer" class="d-flex align-items-center gap-2"></div>
        </ul>
      </div>
    </div>
  </nav>

  <div class="bg-white border-bottom py-3 mb-4">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h3 class="fw-bold mb-0">Product Catalog Management</h3>
          <p class="text-muted small mb-0">Create, edit, and maintain inventory stock and pricing.</p>
        </div>
        <button class="btn btn-primary btn-sm px-3 shadow-sm" onclick="openAddProductModal()">
          <i class="bi bi-plus-lg me-1"></i> Add New Product
        </button>
      </div>
    </div>
  </div>

  <div class="container mb-5">
    <div class="card border-0 shadow-sm rounded-4 bg-white overflow-hidden">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light text-secondary small">
            <tr>
              <th>Image</th>
              <th>Product Details</th>
              <th>Category</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Featured</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="adminProductsTableBody">
            <!-- Populated dynamically by admin-products.js -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ADD / EDIT PRODUCT MODAL -->
  <div class="modal fade" id="productFormModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <form id="newProductForm">
          <div class="modal-header border-bottom">
            <h5 class="modal-title fw-bold" id="productModalTitle">Add New Product</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body p-4">
            <input type="hidden" id="productIdInput">

            <div class="row g-3">
              <div class="col-md-8">
                <label class="form-label small fw-semibold">Product Name *</label>
                <input type="text" id="productNameInput" class="form-control" required placeholder="e.g. Wireless Ergonomic Mouse">
              </div>

              <div class="col-md-4">
                <label class="form-label small fw-semibold">Category *</label>
                <select id="productCategoryInput" class="form-select" required>
                  <option value="Electronics">Electronics</option>
                  <option value="Fashion">Fashion</option>
                  <option value="Home & Kitchen">Home & Kitchen</option>
                  <option value="Sports & Fitness">Sports & Fitness</option>
                  <option value="Books & Media">Books & Media</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-semibold">Price ($ USD) *</label>
                <input type="number" id="productPriceInput" class="form-control" step="0.01" min="0" required placeholder="49.99">
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-semibold">Available Stock Inventory *</label>
                <input type="number" id="productStockInput" class="form-control" min="0" required placeholder="50">
              </div>

              <div class="col-12">
                <label class="form-label small fw-semibold">Image URL</label>
                <input type="url" id="productImageUrlInput" class="form-control" placeholder="https://images.unsplash.com/...">
              </div>

              <div class="col-12">
                <label class="form-label small fw-semibold">Description</label>
                <textarea id="productDescInput" class="form-control" rows="3" placeholder="Provide product details, specifications, etc."></textarea>
              </div>

              <div class="col-12">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="productFeaturedInput">
                  <label class="form-check-label small fw-semibold" for="productFeaturedInput">Mark as Featured on Homepage</label>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer border-top py-2">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary btn-sm px-4">Save Product</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/dfaOrderValidator.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin-products.js"></script>
</body>
</html>
