<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - DFA Commerce</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <nav class="navbar navbar-custom">
    <div class="container justify-content-center">
      <a class="navbar-brand" href="/">
        <div class="brand-icon"><i class="bi bi-diagram-3-fill"></i></div>
        <span>DFA<span class="text-primary">Commerce</span></span>
      </a>
    </div>
  </nav>

  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6 col-xl-5">
        
        <div class="card border-0 shadow-lg rounded-4 p-4 bg-white">
          <div class="text-center mb-4">
            <h4 class="fw-bold text-dark">Create Your Account</h4>
            <p class="text-muted small">Join DFA Commerce to track orders with formal state automaton security.</p>
          </div>

          <div id="regAlert" class="alert alert-danger py-2 small" style="display: none;"></div>

          <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Full Name *</label>
              <input type="text" id="regName" class="form-control" required placeholder="Alex Mercer">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Email Address *</label>
              <input type="email" id="regEmail" class="form-control" required placeholder="alex@example.com">
            </div>

            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Password *</label>
                <input type="password" id="regPassword" class="form-control" required placeholder="At least 6 chars" minlength="6">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Confirm Password *</label>
                <input type="password" id="regConfirmPassword" class="form-control" required placeholder="Re-type password">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Phone Number</label>
              <input type="tel" id="regPhone" class="form-control" placeholder="+1 (555) 123-4567">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Street Address</label>
              <input type="text" id="regStreet" class="form-control" placeholder="123 Oak Street">
            </div>

            <div class="row g-2 mb-4">
              <div class="col-6">
                <label class="form-label small fw-semibold">City</label>
                <input type="text" id="regCity" class="form-control" placeholder="Seattle">
              </div>
              <div class="col-6">
                <label class="form-label small fw-semibold">Postal Code</label>
                <input type="text" id="regPostalCode" class="form-control" placeholder="98101">
              </div>
            </div>

            <button type="submit" id="regSubmitBtn" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
              Create Account
            </button>
          </form>

          <div class="text-center border-top pt-3 small">
            <span class="text-muted">Already registered?</span>
            <a href="/login" class="fw-semibold text-primary text-decoration-none ms-1">Sign in here</a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <footer class="text-center py-3 text-muted small mt-auto">
    &copy; 2026 DFA Commerce • Deterministic Finite Automaton Order Management
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;
      const phone = document.getElementById('regPhone').value.trim();
      const street = document.getElementById('regStreet').value.trim();
      const city = document.getElementById('regCity').value.trim();
      const postalCode = document.getElementById('regPostalCode').value.trim();

      const alertBox = document.getElementById('regAlert');
      const btn = document.getElementById('regSubmitBtn');

      if (password !== confirmPassword) {
        alertBox.textContent = 'Passwords do not match.';
        alertBox.style.display = 'block';
        return;
      }

      alertBox.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, confirmPassword, phone, street, city, postalCode })
        });
        const data = await res.json();

        if (data.success) {
          showToast('Account registered successfully!', 'success');
          setTimeout(() => {
            window.location.href = '/';
          }, 600);
        } else {
          alertBox.textContent = data.error || 'Failed to create account.';
          alertBox.style.display = 'block';
          btn.disabled = false;
          btn.innerHTML = 'Create Account';
        }
      } catch (err) {
        alertBox.textContent = 'Network error during registration.';
        alertBox.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = 'Create Account';
      }
    }
  </script>
</body>
</html>
